<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0908"><meta name="color-scheme" content="dark">
<title>LEGION — цифровой абонемент</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap&subset=cyrillic" rel="stylesheet">
<style>
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{--bg:#0a0908;--g:#c2a46c;--gl:#e3d3ab;--gd:#86693a;--glow:rgba(204,170,107,.42);--t:#f6f3ee;--t2:#a9a59d;--mu:#6c6963;--ok:#3fae68;--okd:#1f6a3e;--e:cubic-bezier(.22,1,.36,1);
--edge:linear-gradient(135deg,var(--gl),var(--gd) 20%,var(--g) 42%,var(--gd) 68%,var(--gl))}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
.shell{position:relative;height:100dvh;max-width:430px;margin:0 auto;overflow:hidden;background:radial-gradient(110% 55% at 50% -5%,rgba(134,105,58,.22),transparent 65%),radial-gradient(90% 45% at 50% 108%,rgba(134,105,58,.16),transparent 70%),var(--bg)}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:24px 16px 32px;display:flex;flex-direction:column;justify-content:center;gap:16px;min-height:100%}
.fr{position:relative;background:var(--edge);padding:1px;box-shadow:0 28px 60px -24px #000f,0 0 36px -14px var(--glow)}
.fr>.in{position:relative;height:100%}
.rim::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:conic-gradient(from var(--a),transparent 0 255deg,#f1e4c0 318deg,transparent 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:spin 7s linear infinite;pointer-events:none;z-index:2}
@keyframes spin{to{--a:360deg}}
.card{background:linear-gradient(135deg,#ffffff13,#fff0 30%,#fff0 68%,#ffffff0a),linear-gradient(160deg,#2d2b28,#1f1e1c 52%,#262421);overflow:hidden;aspect-ratio:1.5/1;padding:20px;display:flex;flex-direction:column;box-shadow:inset 0 1px 0 #fff0cd1f}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,#fff0cd16 50%,transparent 62%);transform:translateX(-120%);animation:sheen 7.5s var(--e) 1.6s infinite}
@keyframes sheen{0%{transform:translateX(-120%)}22%,100%{transform:translateX(120%)}}
.panel{background:linear-gradient(180deg,#1a1918,#131211);padding:16px;box-shadow:inset 0 1px 0 #fff0cd12}
.metal{background:linear-gradient(180deg,var(--gl),var(--g) 55%,var(--gd));-webkit-background-clip:text;background-clip:text;color:transparent}
.disp{font-family:Cinzel,Georgia,serif}
.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.28em;color:var(--mu)}
.hair{height:1px;background:linear-gradient(90deg,transparent,rgba(194,164,108,.7),transparent)}
.chip{border:1px solid rgba(194,164,108,.6);color:var(--gl);border-radius:99px;padding:4px 10px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.24em;flex:none}
.chip.c{border-color:#3fae6899;color:#8fd9a9}.chip.x{border-color:#6c696380;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell{position:relative;aspect-ratio:1;border-radius:14px;border:1px solid transparent;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cell.done{background:linear-gradient(145deg,var(--ok),var(--okd));border-color:#9bd8b3;box-shadow:inset 0 1px 0 #ffffff38}
.cell.done b{position:absolute;bottom:5px;font-size:8.5px;color:#ffffffb3;font-weight:600}
.ck{width:58%;height:58%;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cell.next{background:linear-gradient(145deg,#353230,#201f1d);border-color:rgba(194,164,108,.78);color:var(--gl);font-size:17px;font-weight:600;animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 10px -4px var(--glow)}50%{box-shadow:0 0 20px -2px var(--glow)}}
.cell.lock{background:linear-gradient(145deg,#1b1a19,#121110);border-color:#2e2c29;color:#5a5751;font-size:13px;gap:3px;align-content:center}
.lk{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.cell.fresh{animation:done .9s var(--e) both}
@keyframes done{0%{transform:scale(1.17);filter:brightness(1.6)}100%{transform:scale(1);filter:none}}
.burst{position:absolute;inset:-6px;border-radius:18px;background:radial-gradient(circle,rgba(63,174,104,.5),transparent 68%);animation:burst .95s var(--e) both;pointer-events:none}
@keyframes burst{0%{transform:scale(.6);opacity:0}30%{opacity:1}100%{transform:scale(2.2);opacity:0}}
.fresh .ck{stroke-dasharray:1;animation:draw .5s var(--e) .1s both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.bar{height:5px;border-radius:99px;background:#0b0a09;overflow:hidden;box-shadow:inset 0 1px 2px #000c,0 0 0 1px #fff0cd12}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gd),var(--g) 60%,var(--gl));box-shadow:0 0 12px var(--glow);transition:width 1.1s var(--e)}
.btn{width:100%;display:block;animation:breathe 4.5s ease-in-out infinite}.btn:active{transform:scale(.975)}
@keyframes breathe{50%{filter:drop-shadow(0 0 18px var(--glow))}}
.btn .in{background:linear-gradient(160deg,#2d2b28,#1f1e1c 52%,#262421);padding:18px 24px;text-align:center;font-size:12px;font-weight:600;letter-spacing:.3em;text-transform:uppercase}
.pill{border:1px solid rgba(194,164,108,.35);background:#0008;backdrop-filter:blur(8px);border-radius:99px;padding:8px 16px;font-size:10px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--gl)}.pill:active{transform:scale(.95)}
.ov{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;animation:fi .5s var(--e) both}
@keyframes fi{from{opacity:0}to{opacity:1}}
.dim{background:#000d;backdrop-filter:blur(6px)}
.qr{background:#f6f3ee;padding:12px;border-radius:16px;box-shadow:0 0 40px -8px var(--glow)}.qr svg{display:block;width:216px;height:216px}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;gap:18px;font-size:13px;line-height:1.6;color:var(--t2)}
.spin{position:absolute;top:50%;left:50%;width:36px;height:36px;margin:-18px;border-radius:50%;border:2px solid rgba(194,164,108,.2);border-top-color:var(--g);animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.scan{position:absolute;inset:0;background:#000}
#rd{position:absolute;inset:0}#rd video{width:100%!important;height:100%!important;object-fit:cover}
.aim{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.aim div{position:relative;width:68%;max-width:300px;aspect-ratio:1;animation:pulse 3s ease-in-out infinite;border-radius:16px}
.aim i{position:absolute;width:40px;height:40px;border:0 solid var(--gl)}
.top{position:absolute;inset:0 0 auto;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:16px 16px 32px;background:linear-gradient(#000d,transparent)}
.hint{position:absolute;inset:auto 0 0;z-index:20;padding:48px 24px 40px;text-align:center;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gl);background:linear-gradient(0deg,#000d,transparent)}
.res{z-index:40;color:#fff}.res.ok{background:radial-gradient(120% 80% at 50% 30%,var(--ok),var(--okd) 60%,#0c2a18)}.res.no{background:radial-gradient(120% 80% at 50% 30%,#c0392b,#6a1b14 62%,#2a0a07)}
.ring{width:112px;height:112px;border-radius:50%;border:2px solid #fff9;background:#0003;display:grid;place-items:center;animation:pop .55s var(--e) both}
@keyframes pop{0%{transform:scale(.3);opacity:0}55%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}
.cd{position:absolute;inset:auto 0 0;height:6px;background:#0004}.cd i{display:block;height:100%;background:#fffc;transform-origin:left;animation:cd 3s linear forwards}
@keyframes cd{to{transform:scaleX(0)}}
.dots{display:flex;gap:14px;margin:32px 0 12px}.dots i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(194,164,108,.4);transition:.2s}.dots i.on{background:var(--gl);border-color:var(--gl);transform:scale(1.1);box-shadow:0 0 10px var(--glow)}
.shk{animation:shk .5s}@keyframes shk{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;width:290px;background:linear-gradient(180deg,#1a1918,#131211)}
.keys button{height:56px;border-radius:16px;border:1px solid rgba(194,164,108,.2);background:linear-gradient(#2a2826,#1a1918);font-size:20px}.keys button:active{border-color:var(--g);transform:scale(.95)}
.rv{animation:rv 1s cubic-bezier(.16,1,.3,1) backwards}@keyframes rv{from{opacity:0;transform:translateY(16px) scale(.97)}}
</style></head>
<body><div id="app" class="shell"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const SB_URL="https://aohnxumpgumylwckcwnx.supabase.co", SB_KEY="sb_publishable_BofRI00uyo5Hf07cw5EPQA_f4ey0vUU";
const PIN_HASH="df1864a3f32d08a1a721deeddf594854912d13613d7d73fb460445e95074d973";
const UUID=/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i;
const app=document.getElementById("app");
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
const MARK='<svg viewBox="0 0 48 48" width="40" height="40" fill="none" stroke="#c2a46c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 14 24 6l16 8"/><path d="M8 25 24 17l16 8" opacity=".85"/><path d="M8 36 24 28l16 8" opacity=".65"/></svg>';
const LOCK='<svg class="lk" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.4"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const CHECK='<svg class="ck" viewBox="0 0 24 24" style="width:56px;height:56px" pathLength="1"><path d="M4.5 12.8 9.6 17.8 19.5 6.6"/></svg>';
const CROSS='<svg class="ck" viewBox="0 0 24 24" style="width:56px;height:56px"><path d="M6 6l12 12M18 6 6 18"/></svg>';
let teardown=()=>{};
function route(){teardown();teardown=()=>{};location.hash==="#admin"?adminView():clientView()}
addEventListener("hashchange",route);
if(!SB_URL.startsWith("https://")||SB_KEY.length<20)msg("Не настроено","Впишите SUPABASE_URL и SUPABASE_ANON_KEY в начале файла index.html.");else route();

function msg(title,text,retry){
  app.innerHTML=`<div class="msg rv">${MARK}<div class="disp metal" style="font-size:16px;font-weight:600;letter-spacing:.3em;text-transform:uppercase">${title}</div><div class="hair" style="width:112px"></div><p style="margin:0">${text}</p>${retry?'<button class="pill" id="rt">Повторить</button>':""}</div>`;
  if(retry)document.getElementById("rt").onclick=route;
}

/* ================= КЛИЕНТ ================= */
function clientView(){
  let id=new URLSearchParams(location.search).get("id"),m=id&&id.match(UUID);
  if(m){id=m[0].toLowerCase();try{localStorage.setItem("lg-id",id)}catch(e){}}
  else{try{id=localStorage.getItem("lg-id")}catch(e){id=null}m=id&&id.match(UUID);id=m?m[0]:null}
  if(!id)return msg("Абонемент не найден","Откройте персональную ссылку от клуба LEGION или обратитесь к администратору.");
  let sub=null,prev=null,fresh=null,qr=false,fin=false,first=true,alive=true;
  app.innerHTML='<div class="spin"></div>';

  const apply=s=>{
    const old=prev;prev=s.completed_sessions;sub=s;
    if(old!==null&&s.completed_sessions>old){
      fresh=s.completed_sessions;vib([16,50,28]);
      setTimeout(()=>{fresh=null;draw()},1000);
      if(s.completed_sessions>=s.total_sessions)setTimeout(()=>{vib([24,60,24,60,90]);fin=true;draw()},950);
    }
    draw();
  };
  const load=async()=>{
    const {data,error}=await sb.from("subscriptions").select("*").eq("id",id).maybeSingle();
    if(!alive)return;
    if(error){if(!sub)msg("Нет связи","Не удалось загрузить абонемент. Проверьте интернет.",true);return}
    if(!data)return msg("Абонемент не найден","Такого абонемента нет в системе. Обратитесь к администратору.");
    apply(data);
  };
  function draw(){
    if(!sub)return;
    const s=sub,n=s.total_sessions,c=s.completed_sessions,r=first?" rv":"";
    let cells="";
    for(let i=1;i<=n;i++){
      const p=String(i).padStart(2,"0");
      if(i<=c)cells+=`<div class="cell done${i===fresh?" fresh":""}">${i===fresh?'<i class="burst"></i>':""}${CHECK.replace('style="width:56px;height:56px"','')}<b>${p}</b></div>`;
      else if(s.status==="active"&&i===c+1)cells+=`<div class="cell next">${p}</div>`;
      else cells+=`<div class="cell lock"><span>${p}</span>${LOCK}</div>`;
    }
    const st={active:["","Активен"],completed:["c","Завершён"],expired:["x","Просрочен"]}[s.status]||["x",s.status];
    app.innerHTML=`<div class="scroll">
<div class="fr rim${r}" style="border-radius:30px"><div class="in card" style="border-radius:29px">
 <div style="display:flex;justify-content:space-between"><div><div class="disp metal" style="font-size:26px;font-weight:600;letter-spacing:.34em;line-height:1">LEGION</div><div style="margin-top:10px;font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--t2)">${esc(s.title)}</div></div>${MARK}</div>
 <div style="margin-top:auto;position:relative">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div style="min-width:0"><div class="lbl">Владелец</div><div class="disp" style="margin-top:4px;font-size:16px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.user_name)}</div></div><span class="chip ${st[0]}">${st[1]}</span></div>
  <div class="hair" style="margin:14px 0"></div>
  <div style="display:flex;justify-content:space-between;align-items:flex-end"><span class="lbl">Выполнено</span><span style="font-variant-numeric:tabular-nums"><b style="font-size:34px;font-weight:600">${c}</b> <span style="font-size:18px;color:var(--mu)">/ ${n}</span></span></div>
 </div></div></div>
<div class="fr${r}" style="border-radius:24px;animation-delay:.2s"><div class="in panel" style="border-radius:23px"><div class="grid">${cells}</div></div></div>
<div class="${r}" style="padding:0 4px;animation-delay:.3s"><div class="bar"><i style="width:${n?c/n*100:0}%"></i></div></div>
<button class="btn fr rim${r}" id="qb" style="border-radius:22px;animation-delay:.4s"><span class="in" style="display:block;border-radius:21px;background:linear-gradient(160deg,#2d2b28,#1f1e1c 52%,#262421);padding:18px 24px;font-size:12px;font-weight:600;letter-spacing:.3em;text-transform:uppercase">Показать QR для прохода</span></button>
</div>${qr?qrModal(s):""}${fin?`<div class="ov dim" id="fin"><div class="disp metal" style="font-size:22px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;line-height:1.4">Абонемент<br>завершён</div><div class="hair" style="width:160px;margin:24px 0"></div><div style="font-variant-numeric:tabular-nums">${n} / ${n}</div></div>`:""}`;
    first=false;
    document.getElementById("qb").onclick=()=>{vib(10);qr=true;draw()};
    const cl=document.getElementById("qc"),bg=document.getElementById("qm");
    if(cl)cl.onclick=()=>{qr=false;draw()};
    if(bg)bg.onclick=e=>{if(e.target===bg){qr=false;draw()}};
    const f=document.getElementById("fin");if(f)f.onclick=()=>{fin=false;draw()};
  }
  function qrModal(s){
    const q=qrcode(0,"Q");q.addData(s.id);q.make();
    return `<div class="ov dim" id="qm"><div class="fr rim" style="border-radius:28px;width:100%;max-width:320px"><div class="in card" style="border-radius:27px;aspect-ratio:auto;align-items:center;padding:28px 24px 24px">
<div class="disp" style="font-size:13px;letter-spacing:.5em;color:var(--t2);padding-left:.5em">LEGION</div><div class="hair" style="width:96px;margin:16px 0"></div>
<div class="qr">${q.createSvgTag({cellSize:4,margin:0,scalable:true})}</div>
<div class="disp" style="margin-top:20px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase">${esc(s.user_name)}</div>
<div class="lbl" style="margin-top:6px">Покажите код контроллеру</div>
<button class="pill" id="qc" style="margin-top:22px;color:var(--t2)">Закрыть</button></div></div></div>`;
  }

  load();
  const ch=sb.channel("sub:"+id).on("postgres_changes",{event:"UPDATE",schema:"public",table:"subscriptions",filter:"id=eq."+id},p=>{if(alive)apply(p.new)}).subscribe();
  const vis=()=>{if(document.visibilityState==="visible")load()};
  document.addEventListener("visibilitychange",vis);
  teardown=()=>{alive=false;sb.removeChannel(ch);document.removeEventListener("visibilitychange",vis)};
}

/* ================= АДМИНИСТРАТОР ================= */
async function sha256(v){const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v));return[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,"0")).join("")}
function adminView(){
  let ok=false;try{ok=sessionStorage.getItem("lg-adm")===PIN_HASH}catch(e){}
  ok?scanner():pad();
}
function pad(){
  let pin="",tries=0,lock=0,busy=false;
  app.innerHTML=`<div class="msg rv" style="gap:0">${MARK}<div class="disp metal" style="margin-top:20px;font-size:15px;font-weight:600;letter-spacing:.34em;text-transform:uppercase">Контроллер</div><div class="lbl" style="margin-top:8px">Введите PIN-код</div>
<div class="dots" id="dots">${"<i></i>".repeat(6)}</div><div id="pe" style="height:16px;font-size:11px;color:var(--gl)"></div>
<div class="fr" style="border-radius:24px;margin-top:16px"><div class="in keys" style="border-radius:23px">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<span></span>":`<button data-k="${k}">${k}</button>`).join("")}</div></div>
<button class="pill" id="bk" style="margin-top:24px;color:var(--t2)">К карте</button></div>`;
  const dots=document.getElementById("dots"),pe=document.getElementById("pe");
  const paint=()=>[...dots.children].forEach((d,i)=>d.classList.toggle("on",i<pin.length));
  document.getElementById("bk").onclick=()=>{location.hash=""};
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=async()=>{
    if(Date.now()<lock||busy)return;vib(10);const k=b.dataset.k;
    if(k==="⌫"){pin=pin.slice(0,-1);return paint()}
    if(pin.length>=6)return;pin+=k;paint();
    if(pin.length<6)return;
    busy=true;let h="";try{h=await sha256(pin)}catch(e){}
    busy=false;
    if(h===PIN_HASH){vib([16,50,28]);try{sessionStorage.setItem("lg-adm",PIN_HASH)}catch(e){}return scanner()}
    vib([28,40,28]);pin="";paint();dots.classList.remove("shk");void dots.offsetWidth;dots.classList.add("shk");
    if(++tries>=5){tries=0;lock=Date.now()+30000;pe.textContent="Слишком много попыток. Подождите 30 секунд"}
  });
}
function scanner(){
  app.innerHTML=`<div class="scan"><div id="rd"></div>
<div class="aim"><div>${[["left:0;top:0","border-width:3px 0 0 3px;border-top-left-radius:16px"],["right:0;top:0","border-width:3px 3px 0 0;border-top-right-radius:16px"],["left:0;bottom:0","border-width:0 0 3px 3px;border-bottom-left-radius:16px"],["right:0;bottom:0","border-width:0 3px 3px 0;border-bottom-right-radius:16px"]].map(c=>`<i style="${c[0]};${c[1]}"></i>`).join("")}</div></div>
<div class="top"><button class="pill" id="bk">К карте</button><span class="disp" style="font-size:11px;letter-spacing:.5em;color:var(--t2)">LEGION</span><button class="pill" id="lo">Выйти</button></div>
<div class="hint">Наведите камеру на QR клиента</div><div id="ce" class="msg" style="display:none;z-index:15;background:#000e;color:var(--t2)">Нет доступа к камере. Разрешите её в настройках браузера (нужен HTTPS).<button class="pill" id="rt">Повторить</button></div><div id="res"></div></div>`;
  const res=document.getElementById("res"),ce=document.getElementById("ce");
  let busy=false,tm=0;
  const logout=()=>{try{sessionStorage.removeItem("lg-adm")}catch(e){}route()};
  document.getElementById("bk").onclick=()=>{location.hash=""};
  document.getElementById("lo").onclick=logout;
  const cam=new Html5Qrcode("rd",{verbose:false,formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE]});
  const start=()=>{ce.style.display="none";cam.start({facingMode:"environment"},{fps:10},onScan,()=>{}).catch(()=>{ce.style.display="flex"})};
  document.getElementById("rt").onclick=start;
  const WHY={not_found:"Абонемент не найден в системе",expired:"Срок абонемента истёк",completed:"Все занятия по абонементу уже использованы",forbidden:"Сессия контроллера недействительна. Войдите заново",error:"Ошибка связи с сервером. Повторите сканирование",bad:"Это не QR-код абонемента LEGION"};
  async function onScan(text){
    if(busy)return;busy=true;
    const m=text.match(UUID);let r;
    if(!m)r={ok:false,reason:"bad"};
    else{
      const {data,error}=await sb.rpc("redeem_session",{p_id:m[0].toLowerCase(),p_pin_hash:PIN_HASH});
      r=error||!data?{ok:false,reason:"error"}:data;
    }
    vib(r.ok?[16,50,28]:[28,40,28,40,28]);
    res.innerHTML=r.ok
     ?`<div class="ov res ok"><div class="ring">${CHECK}</div><div class="disp" style="margin-top:32px;font-size:24px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;line-height:1.3">Проход разрешён</div><div style="width:160px;height:1px;background:#fff6;margin:24px 0"></div><div class="disp" style="max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:20px;font-weight:600;letter-spacing:.12em;text-transform:uppercase">${esc(r.user_name)}</div><div style="margin-top:16px;font-size:44px;font-weight:600;font-variant-numeric:tabular-nums">${r.completed_sessions} / ${r.total_sessions}</div><div class="lbl" style="color:#ffffffb3;margin-top:8px">занятие списано</div><div class="cd"><i></i></div></div>`
     :`<div class="ov res no"><div class="ring">${CROSS}</div><div class="disp" style="margin-top:32px;font-size:24px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;line-height:1.3">Проход запрещён</div><div style="width:160px;height:1px;background:#fff6;margin:24px 0"></div>${r.user_name?`<div class="disp" style="font-size:20px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px">${esc(r.user_name)}</div>`:""}<p style="margin:0;max-width:280px;font-size:14px;line-height:1.6;color:#ffffffd9">${WHY[r.reason]||WHY.error}</p><div class="cd"><i></i></div></div>`;
    tm=setTimeout(()=>{res.innerHTML="";busy=false;if(!r.ok&&r.reason==="forbidden")logout()},3000);
  }
  start();
  teardown=()=>{clearTimeout(tm);if(cam.isScanning)cam.stop().then(()=>cam.clear()).catch(()=>{})};
}
</script></body></html>
