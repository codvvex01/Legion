<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0908"><meta name="color-scheme" content="dark">
<title>LEGION — цифровой абонемент</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap&subset=cyrillic" rel="stylesheet">
<style>
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{--bg:#0a0908;--g:#c2a46c;--gl:#e3d3ab;--gd:#86693a;--glow:rgba(204,170,107,.42);--t:#f6f3ee;--t2:#a9a59d;--mu:#6c6963;--ok:#3fae68;--okd:#1f6a3e;--e:cubic-bezier(.22,1,.36,1);
--edge:linear-gradient(135deg,var(--gl),var(--gd) 20%,var(--g) 42%,var(--gd) 68%,var(--gl))}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
.shell{position:relative;height:100dvh;max-width:430px;margin:0 auto;overflow:hidden;background:radial-gradient(110% 55% at 50% -5%,rgba(134,105,58,.22),transparent 65%),radial-gradient(90% 45% at 50% 108%,rgba(134,105,58,.16),transparent 70%),var(--bg)}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:20px 16px 32px;display:flex;flex-direction:column;gap:14px;min-height:100%}
.fr{position:relative;background:var(--edge);padding:1px;box-shadow:0 28px 60px -24px #000f,0 0 36px -14px var(--glow)}
.fr>.in{position:relative;height:100%}
.rim::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:conic-gradient(from var(--a),transparent 0 255deg,#f1e4c0 318deg,transparent 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:spin 7s linear infinite;pointer-events:none;z-index:2}
@keyframes spin{to{--a:360deg}}
.card{background:linear-gradient(135deg,#ffffff13,#fff0 30%,#fff0 68%,#ffffff0a),linear-gradient(160deg,#2d2b28,#1f1e1c 52%,#262421);overflow:hidden;padding:20px;display:flex;flex-direction:column;box-shadow:inset 0 1px 0 #fff0cd1f}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,#fff0cd16 50%,transparent 62%);transform:translateX(-120%);animation:sheen 7.5s var(--e) 1.6s infinite}
@keyframes sheen{0%{transform:translateX(-120%)}22%,100%{transform:translateX(120%)}}
.panel{background:linear-gradient(180deg,#1a1918,#131211);padding:14px;box-shadow:inset 0 1px 0 #fff0cd12}
.metal{background:linear-gradient(180deg,var(--gl),var(--g) 55%,var(--gd));-webkit-background-clip:text;background-clip:text;color:transparent}
.disp{font-family:Cinzel,Georgia,serif}
.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.28em;color:var(--mu)}
.hair{height:1px;background:linear-gradient(90deg,transparent,rgba(194,164,108,.7),transparent)}
.chip{border:1px solid rgba(194,164,108,.6);color:var(--gl);border-radius:99px;padding:4px 10px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.24em;flex:none}
.chip.c{border-color:#3fae6899;color:#8fd9a9}.chip.x{border-color:#e74c3c80;color:#e74c3c}.chip.f{border-color:#f39c1280;color:#f39c12}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.grid.dense{grid-template-columns:repeat(6,1fr);gap:5px;max-height:260px;overflow-y:auto;padding-right:2px}
.cell{position:relative;aspect-ratio:1;border-radius:12px;border:1px solid transparent;display:grid;place-items:center;font-variant-numeric:tabular-nums;font-size:15px}
.grid.dense .cell{border-radius:9px;font-size:12px}
.cell.done{background:linear-gradient(145deg,var(--ok),var(--okd));border-color:#9bd8b3;box-shadow:inset 0 1px 0 #ffffff38}
.cell.done b{position:absolute;bottom:4px;font-size:8px;color:#ffffffb3;font-weight:600}
.ck{width:56%;height:56%;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cell.next{background:linear-gradient(145deg,#353230,#201f1d);border-color:rgba(194,164,108,.78);color:var(--gl);font-weight:600;animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 10px -4px var(--glow)}50%{box-shadow:0 0 20px -2px var(--glow)}}
.cell.lock{background:linear-gradient(145deg,#1b1a19,#121110);border-color:#2e2c29;color:#5a5751;font-size:12px;gap:2px;align-content:center}
.lk{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.cell.fresh{animation:done .9s var(--e) both}
@keyframes done{0%{transform:scale(1.17);filter:brightness(1.6)}100%{transform:scale(1);filter:none}}
.burst{position:absolute;inset:-6px;border-radius:18px;background:radial-gradient(circle,rgba(63,174,104,.5),transparent 68%);animation:burst .95s var(--e) both;pointer-events:none}
@keyframes burst{0%{transform:scale(.6);opacity:0}30%{opacity:1}100%{transform:scale(2.2);opacity:0}}
.bar{height:5px;border-radius:99px;background:#0b0a09;overflow:hidden;box-shadow:inset 0 1px 2px #000c,0 0 0 1px #fff0cd12}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gd),var(--g) 60%,var(--gl));box-shadow:0 0 12px var(--glow);transition:width 1.1s var(--e)}
.btn{width:100%;display:block;animation:breathe 4.5s ease-in-out infinite}.btn:active{transform:scale(.975)}
@keyframes breathe{50%{filter:drop-shadow(0 0 18px var(--glow))}}
.btn .in{background:linear-gradient(160deg,#2d2b28,#1f1e1c 52%,#262421);padding:16px 20px;text-align:center;font-size:12px;font-weight:600;letter-spacing:.3em;text-transform:uppercase}
.pill{border:1px solid rgba(194,164,108,.35);background:#0008;backdrop-filter:blur(8px);border-radius:99px;padding:8px 14px;font-size:10px;font-weight:500;letter-spacing:.25em;text-transform:uppercase;color:var(--gl)}.pill:active{transform:scale(.95)}
.pill.active{background:linear-gradient(135deg,var(--gl),var(--gd));color:#0a0908;border-color:var(--gl);font-weight:700;box-shadow:0 0 14px var(--glow)}
.ov{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;animation:fi .4s var(--e) both}
@keyframes fi{from{opacity:0}to{opacity:1}}
.dim{background:#000d;backdrop-filter:blur(8px)}
.qr{background:#f6f3ee;padding:12px;border-radius:16px;box-shadow:0 0 40px -8px var(--glow)}.qr svg{display:block;width:210px;height:210px}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;gap:16px;font-size:13px;line-height:1.6;color:var(--t2)}
.spin{position:absolute;top:50%;left:50%;width:36px;height:36px;margin:-18px;border-radius:50%;border:2px solid rgba(194,164,108,.2);border-top-color:var(--g);animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.scan{position:absolute;inset:0;background:#000}
#rd{position:absolute;inset:0}#rd video{width:100%!important;height:100%!important;object-fit:cover}
.aim{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.aim div{position:relative;width:68%;max-width:300px;aspect-ratio:1;animation:pulse 3s ease-in-out infinite;border-radius:16px}
.aim i{position:absolute;width:40px;height:40px;border:0 solid var(--gl)}
.top{position:absolute;inset:0 0 auto;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:16px;background:linear-gradient(#000d,transparent)}
.hint{position:absolute;inset:auto 0 0;z-index:20;padding:48px 24px 36px;text-align:center;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gl);background:linear-gradient(0deg,#000d,transparent)}
.res{z-index:40;color:#fff}.res.ok{background:radial-gradient(120% 80% at 50% 30%,var(--ok),var(--okd) 60%,#0c2a18)}.res.no{background:radial-gradient(120% 80% at 50% 30%,#c0392b,#6a1b14 62%,#2a0a07)}
.ring{width:104px;height:104px;border-radius:50%;border:2px solid #fff9;background:#0003;display:grid;place-items:center;animation:pop .55s var(--e) both}
@keyframes pop{0%{transform:scale(.3);opacity:0}55%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}
.cd{position:absolute;inset:auto 0 0;height:5px;background:#0004}.cd i{display:block;height:100%;background:#fffc;transform-origin:left;animation:cd 3s linear forwards}
@keyframes cd{to{transform:scaleX(0)}}
.rv{animation:rv .8s cubic-bezier(.16,1,.3,1) backwards}@keyframes rv{from{opacity:0;transform:translateY(16px) scale(.97)}}

/* Элементы формы и CRM */
.inp{width:100%;background:#131211;border:1px solid rgba(194,164,108,.25);border-radius:12px;padding:12px 14px;color:var(--t);font-size:13px;outline:none}
.inp:focus{border-color:var(--gl);box-shadow:0 0 12px var(--glow)}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(0.8) sepia(50%) saturate(400%) hue-rotate(5deg);cursor:pointer}
.cli-card{background:linear-gradient(180deg,#1c1b19,#141312);border:1px solid rgba(194,164,108,.2);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.btn-mini{padding:6px 10px;font-size:10px;border-radius:8px;border:1px solid rgba(194,164,108,.3);color:var(--gl);background:#1f1e1c;letter-spacing:.1em;text-transform:uppercase}
.btn-mini:active{transform:scale(.95)}
.btn-gold-action{width:100%;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--gl),var(--gd));color:#0a0908;font-size:12px;font-weight:700;letter-spacing:.25em;text-transform:uppercase;box-shadow:0 4px 20px rgba(194,164,108,.25);transition:opacity .2s,transform .1s}
.btn-gold-action:active{transform:scale(.98)}
.btn-gold-action:disabled{opacity:.5;cursor:not-allowed}
</style></head>
<body><div id="app" class="shell"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

<script>
const SB_URL = "https://aohnxumpgumylwckcwnx.supabase.co";
const SB_KEY = "sb_publishable_BofRI00uyo5Hf07cw5EPQA_f4ey0vUU";
const UUID = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i;
const app = document.getElementById("app");
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch(e){} };
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const sb = supabase.createClient(SB_URL, SB_KEY);

const MARK = '<svg viewBox="0 0 48 48" width="40" height="40" fill="none" stroke="#c2a46c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 14 24 6l16 8"/><path d="M8 25 24 17l16 8" opacity=".85"/><path d="M8 36 24 28l16 8" opacity=".65"/></svg>';
const LOCK = '<svg class="lk" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.4"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const CHECK = '<svg class="ck" viewBox="0 0 24 24" style="width:52px;height:52px" pathLength="1"><path d="M4.5 12.8 9.6 17.8 19.5 6.6"/></svg>';
const CROSS = '<svg class="ck" viewBox="0 0 24 24" style="width:52px;height:52px"><path d="M6 6l12 12M18 6 6 18"/></svg>';

let teardown = () => {};

function route() {
  teardown();
  teardown = () => {};
  if (location.hash === "#admin") adminCheck();
  else clientView();
}
addEventListener("hashchange", route);
route();

function msg(title, text, retry) {
  app.innerHTML = `<div class="msg rv">${MARK}<div class="disp metal" style="font-size:16px;font-weight:600;letter-spacing:.3em;text-transform:uppercase">${title}</div><div class="hair" style="width:112px"></div><p style="margin:0">${text}</p>${retry ? '<button class="pill" id="rt">Повторить</button>' : ''}</div>`;
  if (retry) document.getElementById("rt").onclick = route;
}

function mapClient(c) {
  if (!c) return null;
  const now = new Date().toISOString().split("T")[0];
  let status = c.status || 'active';
  if (c.expires_at && c.expires_at < now) status = 'expired';
  return {
    id: c.id,
    user_name: c.full_name || c.name || "Клиент",
    total_sessions: c.total_visits ?? c.total_sessions ?? 30,
    completed_sessions: c.used_visits ?? c.completed_sessions ?? 0,
    status: status,
    expires_at: c.expires_at
  };
}

/* ================= 1. КАРТОЧКА КЛИЕНТА ================= */
async function clientView() {
  let id = new URLSearchParams(location.search).get("id"), m = id && id.match(UUID);
  if (m) { id = m[0].toLowerCase(); try { localStorage.setItem("lg-id", id); } catch(e){} }
  else { try { id = localStorage.getItem("lg-id"); } catch(e){ id = null; } m = id && id.match(UUID); id = m ? m[0] : null; }
  
  if (!id) return msg("Абонемент не найден", "Откройте персональную ссылку от клуба LEGION или обратитесь к администратору.");
  
  let sub = null, prev = null, fresh = null, qr = false, fin = false, first = true, alive = true;
  app.innerHTML = '<div class="spin"></div>';

  const apply = s => {
    const old = prev; prev = s.completed_sessions; sub = s;
    if (old !== null && s.completed_sessions > old) {
      fresh = s.completed_sessions; vib([16, 50, 28]);
      setTimeout(() => { fresh = null; draw(); }, 1000);
      if (s.completed_sessions >= s.total_sessions) {
        setTimeout(() => { vib([24, 60, 24, 60, 90]); fin = true; draw(); }, 950);
      }
    }
    draw();
  };

  const load = async () => {
    const { data, error } = await sb.from("clients").select("*").eq("id", id).maybeSingle();
    if (!alive) return;
    if (error) { if (!sub) msg("Нет связи", "Не удалось загрузить абонемент. Проверьте интернет.", true); return; }
    if (!data) return msg("Абонемент не найден", "Такого абонемента нет в системе.");
    apply(mapClient(data));
  };

  function draw() {
    if (!sub) return;
    const s = sub, n = s.total_sessions, c = s.completed_sessions, r = first ? " rv" : "";
    const isDense = n > 30;
    
    let cells = "";
    for (let i = 1; i <= n; i++) {
      const p = String(i).padStart(2, "0");
      if (i <= c) {
        cells += `<div class="cell done${i === fresh ? " fresh" : ""}">${i === fresh ? '<i class="burst"></i>' : ''}${CHECK.replace('style="width:52px;height:52px"', '')}<b>${p}</b></div>`;
      } else if (s.status === "active" && i === c + 1) {
        cells += `<div class="cell next">${p}</div>`;
      } else {
        cells += `<div class="cell lock"><span>${p}</span>${LOCK}</div>`;
      }
    }

    const stMap = { active: ["", "Активен"], completed: ["c", "Завершён"], expired: ["x", "Просрочен"], frozen: ["f", "Заморожен"] };
    const st = stMap[s.status] || ["x", s.status];
    const expText = s.expires_at ? `До ${new Date(s.expires_at).toLocaleDateString('ru-RU')}` : 'Бессрочный';

    app.innerHTML = `
    <div class="scroll">
      <div class="fr rim${r}" style="border-radius:28px">
        <div class="in card" style="border-radius:27px">
          <div style="display:flex;justify-content:space-between">
            <div>
              <div class="disp metal" style="font-size:24px;font-weight:600;letter-spacing:.34em;line-height:1">LEGION</div>
              <div style="margin-top:8px;font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--t2)">Клубная карта</div>
            </div>
            ${MARK}
          </div>
          <div style="margin-top:22px;position:relative">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
              <div style="min-width:0">
                <div class="lbl">Владелец</div>
                <div class="disp" style="margin-top:4px;font-size:15px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.user_name)}</div>
              </div>
              <span class="chip ${st[0]}">${st[1]}</span>
            </div>
            <div class="hair" style="margin:12px 0"></div>
            <div style="display:flex;justify-content:space-between;align-items:flex-end">
              <div>
                <span class="lbl">Срок</span>
                <div style="font-size:12px;margin-top:2px;color:var(--t2)">${expText}</div>
              </div>
              <span style="font-variant-numeric:tabular-nums"><b style="font-size:32px;font-weight:600">${c}</b> <span style="font-size:16px;color:var(--mu)">/ ${n}</span></span>
            </div>
          </div>
        </div>
      </div>

      <div class="fr${r}" style="border-radius:22px"><div class="in panel" style="border-radius:21px"><div class="grid ${isDense ? 'dense' : ''}">${cells}</div></div></div>
      <div class="${r}" style="padding:0 4px"><div class="bar"><i style="width:${n ? (c / n * 100) : 0}%"></i></div></div>

      <button class="btn fr rim${r}" id="qb" style="border-radius:20px"><span class="in" style="display:block;border-radius:19px">Показать QR для прохода</span></button>
    </div>
    ${qr ? qrModal(s) : ''}
    ${fin ? `<div class="ov dim" id="fin"><div class="disp metal" style="font-size:22px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;line-height:1.4">Абонемент<br>завершён</div><div class="hair" style="width:160px;margin:24px 0"></div><div style="font-variant-numeric:tabular-nums">${n} / ${n}</div></div>` : ''}
    `;

    first = false;
    document.getElementById("qb").onclick = () => { vib(10); qr = true; draw(); };
    const cl = document.getElementById("qc"), bg = document.getElementById("qm");
    if (cl) cl.onclick = () => { qr = false; draw(); };
    if (bg) bg.onclick = e => { if (e.target === bg) { qr = false; draw(); } };
    const f = document.getElementById("fin"); if (f) f.onclick = () => { fin = false; draw(); };
  }

  function qrModal(s) {
    const q = qrcode(0, "Q"); q.addData(s.id); q.make();
    return `
    <div class="ov dim" id="qm">
      <div class="fr rim" style="border-radius:26px;width:100%;max-width:320px">
        <div class="in card" style="border-radius:25px;align-items:center;padding:26px 20px 22px">
          <div class="disp" style="font-size:13px;letter-spacing:.5em;color:var(--t2);padding-left:.5em">LEGION</div>
          <div class="hair" style="width:96px;margin:14px 0"></div>
          <div class="qr">${q.createSvgTag({cellSize:4, margin:0, scalable:true})}</div>
          <div class="disp" style="margin-top:18px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase">${esc(s.user_name)}</div>
          <div class="lbl" style="margin-top:6px">Покажите код контроллеру</div>
          <button class="pill" id="qc" style="margin-top:20px;color:var(--t2)">Закрыть</button>
        </div>
      </div>
    </div>`;
  }

  load();
  const ch = sb.channel("client:" + id).on("postgres_changes", { event: "UPDATE", schema: "public", table: "clients", filter: "id=eq." + id }, p => {
    if (alive) apply(mapClient(p.new));
  }).subscribe();

  const vis = () => { if (document.visibilityState === "visible") load(); };
  document.addEventListener("visibilitychange", vis);
  teardown = () => { alive = false; sb.removeChannel(ch); document.removeEventListener("visibilitychange", vis); };
}

/* ================= 2. СТАБИЛЬНЫЙ ВХОД АДМИНИСТРАТОРА ================= */
async function adminCheck() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) adminHub();
  else loginView();
}

function loginView() {
  app.innerHTML = `
  <div class="msg rv">
    ${MARK}
    <div class="disp metal" style="margin-top:12px;font-size:16px;font-weight:600;letter-spacing:.3em;text-transform:uppercase">Контроллер</div>
    <div class="lbl">Вход в систему LEGION</div>
    
    <form id="adm-form" style="width:100%;max-width:280px;display:flex;flex-direction:column;gap:10px;margin-top:12px">
      <input type="email" id="adm-em" class="inp" placeholder="Email контроллера" autocomplete="username" required>
      <input type="password" id="adm-pw" class="inp" placeholder="Пароль" autocomplete="current-password" required>
      <div id="adm-err" style="color:#e74c3c;font-size:11px;min-height:14px;line-height:1.4"></div>
      
      <button type="submit" id="adm-sub" class="btn-gold-action">Войти</button>
      <button type="button" class="pill" id="adm-bk" style="margin-top:6px">К карте</button>
    </form>
  </div>`;

  document.getElementById("adm-bk").onclick = () => { location.hash = ""; };
  
  const form = document.getElementById("adm-form");
  const btn = document.getElementById("adm-sub");
  const errEl = document.getElementById("adm-err");

  form.onsubmit = async e => {
    e.preventDefault();
    const email = document.getElementById("adm-em").value.trim();
    const password = document.getElementById("adm-pw").value;

    if (!email || !password) {
      errEl.textContent = "Заполните все поля";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Вход...";
    errEl.textContent = "";

    try {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        errEl.textContent = error.message.includes("Invalid login credentials") 
          ? "Неверный логин или пароль" 
          : error.message;
        vib([28, 40, 28]);
      } else {
        vib([16, 50, 28]);
        adminHub();
      }
    } catch (err) {
      errEl.textContent = "Ошибка сети. Попробуйте снова.";
    } finally {
      btn.disabled = false;
      btn.textContent = "Войти";
    }
  };
}

/* ================= 3. ХАБ АДМИНИСТРАТОРА (Сканер / Клиенты / Журнал) ================= */
let curTab = "scan";
let allClients = [];

function adminHub() {
  app.innerHTML = `
  <div style="display:flex;flex-direction:column;height:100dvh">
    <div style="padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:#000;border-bottom:1px solid rgba(194,164,108,.2)">
      <span class="disp metal" style="font-size:14px;font-weight:700;letter-spacing:.3em">LEGION CRM</span>
      <div style="display:flex;gap:6px">
        <button class="pill ${curTab==='scan'?'active':''}" id="tb-sc">Сканер</button>
        <button class="pill ${curTab==='cli'?'active':''}" id="tb-cl">Клиенты</button>
        <button class="pill ${curTab==='log'?'active':''}" id="tb-lg">Журнал</button>
        <button class="pill" id="tb-out" style="color:#e74c3c;border-color:#e74c3c40">Выход</button>
      </div>
    </div>
    <div id="adm-body" style="flex:1;position:relative;overflow:hidden"></div>
  </div>`;

  document.getElementById("tb-sc").onclick = () => { curTab = "scan"; adminHub(); };
  document.getElementById("tb-cl").onclick = () => { curTab = "cli"; adminHub(); };
  document.getElementById("tb-lg").onclick = () => { curTab = "log"; adminHub(); };
  document.getElementById("tb-out").onclick = async () => { await sb.auth.signOut(); location.hash = ""; };

  if (curTab === "scan") scannerTab();
  else if (curTab === "cli") clientsTab();
  else logsTab();
}

/* --- Вкладка: Сканер --- */
function scannerTab() {
  const box = document.getElementById("adm-body");
  box.innerHTML = `
  <div class="scan">
    <div id="rd"></div>
    <div class="aim"><div>${[["left:0;top:0","border-width:3px 0 0 3px;border-top-left-radius:16px"],["right:0;top:0","border-width:3px 3px 0 0;border-top-right-radius:16px"],["left:0;bottom:0","border-width:0 0 3px 3px;border-bottom-left-radius:16px"],["right:0;bottom:0","border-width:0 3px 3px 0;border-bottom-right-radius:16px"]].map(c=>`<i style="${c[0]};${c[1]}"></i>`).join("")}</div></div>
    <div class="hint">Наведите камеру на QR клиента</div>
    <div id="ce" class="msg" style="display:none;z-index:15;background:#000e;color:var(--t2)">Нет доступа к камере.<button class="pill" id="rt-c">Повторить</button></div>
    <div id="res"></div>
  </div>`;

  const res = document.getElementById("res"), ce = document.getElementById("ce");
  let busy = false, tm = 0;
  const cam = new Html5Qrcode("rd", { verbose: false, formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE] });

  const start = () => {
    ce.style.display = "none";
    cam.start({ facingMode: "environment" }, { fps: 10 }, onScan, () => {}).catch(() => { ce.style.display = "flex"; });
  };
  document.getElementById("rt-c").onclick = start;

  async function onScan(text) {
    if (busy) return; busy = true;
    const m = text.match(UUID);
    if (!m) {
      showRes(false, "Неверный QR", "Это не QR-код абонемента LEGION");
      return;
    }

    const { data, error } = await sb.rpc("check_in_client", { p_id: m[0].toLowerCase() });
    
    const { data: cl } = await sb.from("clients").select("full_name, total_visits, used_visits").eq("id", m[0].toLowerCase()).maybeSingle();
    const name = cl ? cl.full_name : "Клиент";

    if (error || !data || !data.success) {
      showRes(false, name, data ? data.message : "Ошибка списания");
    } else {
      showRes(true, name, `${cl.used_visits} / ${cl.total_visits}`, data.remaining);
    }
  }

  function showRes(ok, name, subtitle, remaining) {
    vib(ok ? [16, 50, 28] : [28, 40, 28, 40, 28]);
    res.innerHTML = ok
      ? `<div class="ov res ok"><div class="ring">${CHECK}</div><div class="disp" style="margin-top:28px;font-size:22px;font-weight:700;letter-spacing:.2em;text-transform:uppercase">Проход разрешён</div><div style="width:140px;height:1px;background:#fff6;margin:18px 0"></div><div class="disp" style="font-size:18px;font-weight:600;letter-spacing:.1em;text-transform:uppercase">${esc(name)}</div><div style="margin-top:14px;font-size:40px;font-weight:600;font-variant-numeric:tabular-nums">${subtitle}</div><div class="lbl" style="color:#ffffffb3;margin-top:6px">Осталось занятий: ${remaining}</div><div class="cd"><i></i></div></div>`
      : `<div class="ov res no"><div class="ring">${CROSS}</div><div class="disp" style="margin-top:28px;font-size:22px;font-weight:700;letter-spacing:.2em;text-transform:uppercase">Проход отклонён</div><div style="width:140px;height:1px;background:#fff6;margin:18px 0"></div><div class="disp" style="font-size:18px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px">${esc(name)}</div><p style="margin:0;font-size:13px;line-height:1.5;color:#ffffffd9">${subtitle}</p><div class="cd"><i></i></div></div>`;
    
    tm = setTimeout(() => { res.innerHTML = ""; busy = false; }, 3000);
  }

  start();
  teardown = () => { clearTimeout(tm); if (cam.isScanning) cam.stop().then(() => cam.clear()).catch(()=>{}); };
}

/* --- Вкладка: Управление клиентами --- */
async function clientsTab() {
  const box = document.getElementById("adm-body");
  box.innerHTML = `
  <div style="padding:14px;height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;gap:6px">
      <input type="text" id="cli-srch" class="inp" placeholder="Поиск по ФИО..." style="flex:1">
      <button class="pill active" id="cli-add" style="flex:none">+ Абонемент</button>
      <button class="pill" id="cli-purge" style="flex:none;color:#e74c3c;border-color:#e74c3c60">🗑 Архив</button>
    </div>
    
    <!-- Форма создания нового абонемента -->
    <div id="cli-modal" class="fr" style="display:none;border-radius:18px;margin-bottom:10px">
      <div class="in panel" style="border-radius:17px;display:flex;flex-direction:column;gap:10px">
        <div class="disp metal" style="font-size:13px;letter-spacing:.2em;font-weight:600">Новый абонемент</div>
        <input type="text" id="nc-name" class="inp" placeholder="ФИО клиента">
        
        <div style="display:flex;gap:8px;align-items:center">
          <input type="number" id="nc-tot" class="inp" placeholder="Количество занятий" value="30" min="1" style="flex:1">
          <span style="font-size:11px;color:var(--t2);white-space:nowrap">занятий</span>
        </div>

        <div style="display:flex;gap:6px">
          <button type="button" class="btn-mini" onclick="document.getElementById('nc-tot').value=12">12</button>
          <button type="button" class="btn-mini" onclick="document.getElementById('nc-tot').value=15">15</button>
          <button type="button" class="btn-mini" onclick="document.getElementById('nc-tot').value=30">30</button>
          <button type="button" class="btn-mini" onclick="document.getElementById('nc-tot').value=90">90</button>
          <button type="button" class="btn-mini" onclick="document.getElementById('nc-tot').value=180">180</button>
        </div>

        <div>
          <div style="font-size:11px;color:var(--t2);margin-bottom:4px">Срок (оставьте пустым для бессрочного):</div>
          <input type="date" id="nc-date" class="inp">
        </div>

        <div style="display:flex;gap:8px;margin-top:6px">
          <button class="btn-mini" id="nc-save" style="flex:1;background:var(--okd);color:#fff;padding:10px">Сохранить</button>
          <button class="btn-mini" id="nc-cancel" style="flex:1;padding:10px">Отмена</button>
        </div>
      </div>
    </div>

    <div id="cli-list" style="display:flex;flex-direction:column;gap:10px">Загрузка клиентов...</div>
  </div>`;

  const modal = document.getElementById("cli-modal");
  document.getElementById("cli-add").onclick = () => { modal.style.display = modal.style.display === "none" ? "block" : "none"; };
  document.getElementById("nc-cancel").onclick = () => { modal.style.display = "none"; };
  document.getElementById("cli-purge").onclick = deleteCompletedClients;
  
  document.getElementById("nc-save").onclick = async () => {
    const name = document.getElementById("nc-name").value.trim();
    const tot = parseInt(document.getElementById("nc-tot").value) || 30;
    const dateVal = document.getElementById("nc-date").value;
    
    if (!name) return alert("Введите ФИО");

    const { error } = await sb.from("clients").insert([{
      full_name: name,
      total_visits: tot,
      used_visits: 0,
      status: 'active',
      expires_at: dateVal ? dateVal : null
    }]);

    if (error) alert(error.message);
    else {
      modal.style.display = "none";
      document.getElementById("nc-name").value = "";
      document.getElementById("nc-date").value = "";
      loadClients();
    }
  };

  document.getElementById("cli-srch").oninput = e => {
    const q = e.target.value.toLowerCase();
    renderClients(allClients.filter(c => (c.full_name || '').toLowerCase().includes(q)));
  };

  async function loadClients() {
    const { data } = await sb.from("clients").select("*").order("created_at", { ascending: false });
    allClients = data || [];
    renderClients(allClients);
  }

  function renderClients(list) {
    const cl = document.getElementById("cli-list");
    if (!list.length) { cl.innerHTML = '<div style="color:var(--mu);text-align:center;margin-top:20px">Клиентов не найдено</div>'; return; }
    cl.innerHTML = list.map(c => {
      const link = `${location.origin}${location.pathname}?id=${c.id}`;
      const isExp = c.expires_at && c.expires_at < new Date().toISOString().split("T")[0];
      const isFinished = c.used_visits >= c.total_visits;
      const st = isExp ? 'expired' : (isFinished ? 'completed' : c.status);
      const stColors = { active: '#3fae68', frozen: '#f39c12', expired: '#e74c3c', completed: '#8fd9a9' };
      const pct = Math.min(100, Math.round((c.used_visits / c.total_visits) * 100));

      return `
      <div class="cli-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <div class="disp" style="font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase">${esc(c.full_name)}</div>
            <div style="font-size:11px;color:var(--t2);margin-top:2px">${c.expires_at ? ('До: ' + new Date(c.expires_at).toLocaleDateString('ru-RU')) : 'Бессрочный'}</div>
          </div>
          <span style="font-size:9px;font-weight:700;text-transform:uppercase;color:${stColors[st]||'#aaa'}">${st}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-top:4px">
          <span style="color:var(--t2)">Занятия</span>
          <span style="font-weight:600">${c.used_visits} / ${c.total_visits}</span>
        </div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
          <button class="btn-mini" onclick="copyCardLink('${link}')">📋 Ссылка</button>
          <a class="btn-mini" style="text-decoration:none" href="https://wa.me/?text=${encodeURIComponent('Ваш абонемент LEGION: ' + link)}" target="_blank">💬 WhatsApp</a>
          <button class="btn-mini" onclick="toggleFreeze('${c.id}', '${c.status}')">${c.status === 'frozen' ? 'Разморозить' : 'Заморозить'}</button>
          <button class="btn-mini" onclick="resetVisits('${c.id}')">Сброс</button>
          <button class="btn-mini" style="color:#e74c3c;border-color:#e74c3c50" onclick="deleteClient('${c.id}', '${esc(c.full_name)}')">🗑 Удалить</button>
        </div>
      </div>`;
    }).join("");
  }

  loadClients();
}

/* --- Вкладка: Журнал проходов --- */
async function logsTab() {
  const box = document.getElementById("adm-body");
  box.innerHTML = `<div id="log-box" style="padding:14px;height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:8px">Загрузка журнала...</div>`;
  
  const { data } = await sb.from("visit_logs").select("*, clients(full_name)").order("created_at", { ascending: false }).limit(40);
  const el = document.getElementById("log-box");
  if (!data || !data.length) { el.innerHTML = '<div style="color:var(--mu);text-align:center;margin-top:20px">Журнал пуст</div>'; return; }

  el.innerHTML = data.map(l => `
    <div style="background:#141312;border:1px solid rgba(194,164,108,.2);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:13px;font-weight:600">${esc(l.clients?.full_name || 'Клиент')}</div>
        <div style="font-size:10px;color:var(--mu);margin-top:2px">${new Date(l.created_at).toLocaleString('ru-RU')}</div>
      </div>
      <div style="font-size:10px;color:var(--gl);text-align:right">${esc(l.controller_email || 'контроллер')}</div>
    </div>
  `).join("");
}

/* --- Операции CRM --- */
window.copyCardLink = url => {
  navigator.clipboard.writeText(url);
  alert("Ссылка на абонемент скопирована!");
};

window.toggleFreeze = async (id, cur) => {
  const next = cur === 'frozen' ? 'active' : 'frozen';
  await sb.from("clients").update({ status: next }).eq("id", id);
  clientsTab();
};

window.resetVisits = async id => {
  if (confirm("Сбросить использованные занятия на 0?")) {
    await sb.from("clients").update({ used_visits: 0 }).eq("id", id);
    clientsTab();
  }
};

window.deleteClient = async (id, name) => {
  if (confirm(`Удалить абонемент «${name}» безвозвратно?`)) {
    const { error } = await sb.from("clients").delete().eq("id", id);
    if (error) alert("Ошибка: " + error.message);
    else clientsTab();
  }
};

window.deleteCompletedClients = async () => {
  const today = new Date().toISOString().split("T")[0];
  const toDelete = allClients.filter(c => 
    c.used_visits >= c.total_visits || 
    c.status === 'completed' || 
    (c.expires_at && c.expires_at < today)
  );

  if (toDelete.length === 0) {
    alert("Нет завершённых или просроченных абонементов.");
    return;
  }

  if (confirm(`Найдено завершённых/просроченных абонементов: ${toDelete.length}.\nУдалить их все навсегда?`)) {
    const ids = toDelete.map(c => c.id);
    const { error } = await sb.from("clients").delete().in("id", ids);
    if (error) alert("Ошибка удаления: " + error.message);
    else {
      alert(`Удалено абонементов: ${ids.length}`);
      clientsTab();
    }
  }
};
</script>
